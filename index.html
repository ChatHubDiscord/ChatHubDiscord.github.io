<!DOCTYPE html>
<html>
    <head>
        <title>ChatHub Discord server</title>
        <style>
            * { background-color: #000; }
        </style>

        <meta http-equiv="refresh" content="0; url=https://discord.gg/b4rZePb8ca" />

        <!-- General Embed Details -->
        <meta property="og:title" content="ChatHub" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://discord.gg/b4rZePb8ca" />
        <meta property="og:description" content="The community built for you" />
        <meta property="og:site_name" content="ChatHub Discord invite" />

        <!-- 
          Discord handles images via Twitter card types:
          1. 'summary' puts the image as a small thumbnail on the side.
          2. 'summary_large_image' puts the image as a large banner across the bottom.
        -->
        <meta name="twitter:card" content="summary_large_image" />
        
        <!-- The main banner image (large image) -->
        <meta property="og:image" content="https://i.postimg.cc/y8t6H03h/hizm1bs-Tik-Tok-Downloader-com-83833.gif" />
        <meta name="twitter:image" content="https://i.postimg.cc/y8t6H03h/hizm1bs-Tik-Tok-Downloader-com-83833.gif" />

        <!-- 
          Note: Discord embeds generally only support ONE primary image per link preview. 
          If you want the logo as a thumbnail and the GIF as a banner simultaneously, 
          standard OpenGraph meta tags alone cannot force Discord to display both 
          as separate UI elements (thumbnail + banner) at the same time. 
          Usually, developers combine both images into a single banner asset if 
          a specific layout is required.
        -->
    </head>
    <body>
    </body>
</html>
